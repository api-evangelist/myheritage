aid: myheritage
name: MyHeritage
description: 'MyHeritage is an online genealogy and consumer DNA platform that lets
  families build and explore their family trees, take at-home DNA tests for ancestry
  and genetic ethnicity, and search more than 40 billion historical records for genealogy
  research. Founded in 2003 and headquartered in Israel, the company also offers photo
  tools such as colorization, enhancement and the AI-based Deep Nostalgia animation
  feature, alongside DNA matching that connects relatives worldwide. MyHeritage previously
  operated a public FamilyGraph developer API, but that program has been retired: the
  developers.myheritage.com and developer.myheritage.com hosts now 301-redirect to
  the company homepage and familygraph.com no longer resolves to documentation, so there
  is no current public API surface to catalog. This profile therefore captures the
  company identity and its published web properties.'
